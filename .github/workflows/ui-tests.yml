name: UI Tests

# flag-baseline/ is detection data for the flag image watch (#175) — PNGs no page
# references and no test reads. A pull request that only touches them has nothing
# for Playwright to run against, and because that PR is opened by
# github-actions[bot], a queued run would sit at "waiting for approval" instead of
# just being pointless. Skipping the trigger removes the prompt rather than
# answering it every week.
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'flag-baseline/**'
  push:
    branches:
      - master
    paths-ignore:
      - 'flag-baseline/**'

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate flaginfo.json
        run: node scripts/validate-flaginfo.mjs

      - name: Validate flag cross-links
        run: node scripts/validate-flag-links.mjs

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
