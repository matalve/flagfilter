<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="not_found_title">Page not found - Flagfilter</title>
    <!-- Cloudflare Pages serves this file with status 404 for every path that
         matches nothing. Without it, Pages treats the project as a single-page app
         and answers every unknown path with index.html and status 200. See #232.
         Self-contained on purpose: it can be served at any depth, so every URL is
         absolute, and it loads no script or stylesheet that could itself be
         missing. Both languages are on the page because there is no i18n here.
         The copy is kept in i18n/ui/*.json under not_found_*, and each element
         names its key in data-i18n; a test fails if the two disagree. -->
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#1e8080">
    <style>
        :root {
            --primary-color: #1e8080;
            --text-color: #1f2937;
            --muted-color: #4b5563;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #44bbbb;
                --text-color: #f9fafb;
                --muted-color: #d1d5db;
                --bg-color: #111827;
                --card-bg: #1f2937;
                --border-color: #374151;
            }
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        main {
            max-width: 32rem;
            width: 100%;
            box-sizing: border-box;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }
        section + section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }
        h1 {
            font-size: 1.375rem;
            margin: 0 0 8px;
        }
        p {
            margin: 0 0 16px;
            color: var(--muted-color);
        }
        a {
            color: var(--primary-color);
            font-weight: 600;
            text-underline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1 data-i18n="not_found_heading">Page not found</h1>
            <p data-i18n="not_found_text">There is nothing at this address. It may have been mistyped, or the link may be out of date.</p>
            <a href="/" data-i18n="not_found_link">Go to Flagfilter</a>
        </section>
        <section lang="es">
            <h1 data-i18n="not_found_heading">Página no encontrada</h1>
            <p data-i18n="not_found_text">No hay nada en esta dirección. Puede que esté mal escrita o que el enlace esté desactualizado.</p>
            <a href="/?lang=es" data-i18n="not_found_link">Ir a Flagfilter</a>
        </section>
    </main>
</body>
</html>
