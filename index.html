    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flagfilter - Filtering and Exploring Flags</title>
    <meta name="description" content="Explore and filter flags from around the world. Search by country name, filter by colors and continents, and discover interesting flag facts.">
    <meta name="keywords" content="flags, world flags, flag filter, flag explorer, flag colors, flag continents, flag search">
    <meta name="author" content="Flagfilter">
    <meta property="og:title" content="Flagfilter - Filtering and Exploring Flags">
    <meta property="og:description" content="Explore and filter flags from around the world. Search by country name, filter by colors and continents, and discover interesting flag facts.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://flagfilter.com/">
    <!-- Absolute URL on purpose: most scrapers (Slack, iMessage, LinkedIn) will not
         resolve a relative og:image, which is why the original never rendered. -->
    <meta property="og:image" content="https://flagfilter.com/opengraph.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="627">
    <link rel="canonical" href="https://flagfilter.com/">
    <!-- Icon set restored from a40dbfd^ — it was deleted wholesale by the April 2025
         rework, not missing by design. /favicon.ico is deliberately a real file even
         though nothing links to it: browsers that ignore the <link> tags request it
         anyway, and that request is what was 404ing into the HTML response. See #138. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#4f46e5">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <!-- Warm the connection to the flag image host early (every flag loads from here);
         no crossorigin since the images are plain non-CORS <img> requests. -->
    <link rel="preconnect" href="https://flagcdn.com">
    <!-- Preload the first flag (Afghanistan) as the LCP image so it is discoverable
         before the data fetch. The href must match the grid's <img> src exactly (see
         rebuildFlags in js/flags.js) to avoid a double fetch. The grid is sorted by
         localized name (#123), and "af" happens to come first in both English and
         Spanish — a language whose first flag differs would fall back to a second
         fetch, not a broken page. -->
    <link rel="preload" as="image" href="https://flagcdn.com/w320/af.webp" fetchpriority="high">
    <!-- The module graph is only discoverable one hop at a time: the browser has to
         fetch and parse script.js before it learns about js/*.js, and modal.js before
         it learns about report.js. Declaring them here collapses that into a single
         round trip. Unsupported browsers ignore the hint. See #143. -->
    <link rel="modulepreload" href="js/state.js">
    <link rel="modulepreload" href="js/util.js">
    <link rel="modulepreload" href="js/translate.js">
    <link rel="modulepreload" href="js/theme.js">
    <link rel="modulepreload" href="js/i18n.js">
    <link rel="modulepreload" href="js/flags.js">
    <link rel="modulepreload" href="js/filters.js">
    <link rel="modulepreload" href="js/modal.js">
    <link rel="modulepreload" href="js/report.js">
    <!-- Apply the theme before first paint so a saved or system dark preference
         does not flash the light theme first. Mirrors the storage key and the
         fallback logic in initDarkMode() in script.js — keep the two in sync.
         Inline on purpose: it must run before the deferred app script, and the
         CSP already allows inline scripts. See #143. -->
    <script>
        (function () {
            var saved = null;
            try {
                saved = localStorage.getItem('darkMode');
            } catch (error) {
                // Storage can be denied outright (private mode, blocked cookies)
                // — fall through to the system theme.
            }
            var dark = saved !== null
                ? saved === 'true'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.toggle('dark-mode', dark);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

                            <button class="filter-btn" data-people="human"><svg class="icon" aria-hidden="true"><use href="#i-user-friends"></use></svg> Human</button>
                            <button class="filter-btn" data-people="hat"><svg class="icon" aria-hidden="true"><use href="#i-hat-cowboy"></use></svg> Hat</button>
                            <button class="filter-btn" data-people="hand"><svg class="icon" aria-hidden="true"><use href="#i-hand-paper"></use></svg> Hand</button>
                        </div>
                    </div>

                    <div class="compact-filter-group">
                        <h3>Ideology</h3>
                        <div class="ideology-filters">
                            <button class="filter-btn" data-ideology="christianity"><svg class="icon" aria-hidden="true"><use href="#i-cross"></use></svg> Christianity</button>
                            <button class="filter-btn" data-ideology="islam"><svg class="icon" aria-hidden="true"><use href="#i-mosque"></use></svg> Islam</button>
                            <button class="filter-btn" data-ideology="communism"><svg class="icon" aria-hidden="true"><use href="#i-hammer"></use></svg> Communism</button>
                            <button class="filter-btn" data-ideology="buddhism"><svg class="icon" aria-hidden="true"><use href="#i-dharmachakra"></use></svg> Buddhism</button>
                            <button class="filter-btn" data-ideology="hinduism"><svg class="icon" aria-hidden="true"><use href="#i-om"></use></svg> Hinduism</button>
                            <button class="filter-btn" data-ideology="judaism"><svg class="icon" aria-hidden="true"><use href="#i-star-of-david"></use></svg> Judaism</button>
                        </div>
                    </div>

                    <div class="compact-filter-group">
                        <h3>Text</h3>
                        <div class="text-filters">
                            <button class="filter-btn" data-text="text"><svg class="icon" aria-hidden="true"><use href="#i-font"></use></svg> Text</button>
                            <button class="filter-btn" data-text="motto"><svg class="icon" aria-hidden="true"><use href="#i-quote-right"></use></svg> Motto</button>
                            <button class="filter-btn" data-text="name"><svg class="icon" aria-hidden="true"><use href="#i-signature"></use></svg> Name</button>
                            <button class="filter-btn" data-text="ribbon"><svg class="icon" aria-hidden="true"><use href="#i-ribbon"></use></svg> Ribbon</button>
                        </div>
                    </div>

                    <!-- Colour traditions and the British ensign family. These come from
                         curated tags in flaginfo.json, not from the colours themselves:
                         a flag using red, black, white and green is not thereby pan-Arab.
                         Each button carries an example from its own family, chosen by the
                         owner: Ethiopia as the origin of the pan-African colours, Jordan
                         for the Arab Revolt palette, Czechia because its wedge is the one
                         pan-Slavic flag you cannot mistake for the others, and the Union
                         Jack the ensigns are built on. flagcdn's 4:3 sizes are the waving
                         variant; 2x covers retina. See #141. -->
                    <div class="compact-filter-group">
                        <h3>Flag family</h3>
                        <div class="family-filters">
                            <button class="filter-btn" data-family="pan-african"><img class="icon flag-icon" src="https://flagcdn.com/20x15/et.webp" srcset="https://flagcdn.com/40x30/et.webp 2x" width="20" height="15" alt="" loading="lazy" decoding="async"> Pan-African</button>
                            <button class="filter-btn" data-family="pan-arab"><img class="icon flag-icon" src="https://flagcdn.com/20x15/jo.webp" srcset="https://flagcdn.com/40x30/jo.webp 2x" width="20" height="15" alt="" loading="lazy" decoding="async"> Pan-Arab</button>
                            <button class="filter-btn" data-family="pan-slavic"><img class="icon flag-icon" src="https://flagcdn.com/20x15/cz.webp" srcset="https://flagcdn.com/40x30/cz.webp 2x" width="20" height="15" alt="" loading="lazy" decoding="async"> Pan-Slavic</button>
                            <button class="filter-btn" data-family="british"><img class="icon flag-icon" src="https://flagcdn.com/20x15/gb.webp" srcset="https://flagcdn.com/40x30/gb.webp 2x" width="20" height="15" alt="" loading="lazy" decoding="async"> British</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="flagGrid" class="flag-grid">
            <!-- Flags will be dynamically inserted here -->
        </div>
        </main>
    </div>

            </div>
        </div>
    </div>

</body>
